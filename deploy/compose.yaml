name: linkora
services:
  api:
    image: ${IMAGE_REPOSITORY:?请设置镜像仓库前缀}-api:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?请设置 NC 专用数据库连接}
      SITE_URL: ${SITE_URL:?请设置完整站点地址}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      LOGIN_LIMIT: ${LOGIN_LIMIT:-10}
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-false}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [app]
  web:
    image: ${IMAGE_REPOSITORY:?请设置镜像仓库前缀}-web:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy_network
      traefik.http.routers.linkora.rule: Host(`nav.icio.eu.org`)
      traefik.http.routers.linkora.entrypoints: web
      traefik.http.services.linkora.loadbalancer.server.port: "80"
    networks: [app, proxy_network]
networks:
  app:
    driver: bridge
  proxy_network:
    external: true

function b64(a){return btoa(Array.from(a,x=>String.fromCharCode(x)).join(''))}
function fromB64(x){return Uint8Array.from(atob(x),x=>x.charCodeAt(0))}
async function derive(password,salt){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptData(key,data){const iv=crypto.getRandomValues(new Uint8Array(12));const bytes=new TextEncoder().encode(JSON.stringify(data));const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes);return {iv:b64(iv),data:b64(new Uint8Array(encrypted))}}
async function decryptData(key,item){return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(item.iv)},key,fromB64(item.data))))}

let writeQueue=Promise.resolve();
function saveAll(){
 if(!logged()){savePublic();return Promise.resolve(true)}
 const allCats=cats().map(c=>({...c})),allBks=bks().map(b=>({...b}));
 const byId=new Map(allCats.map(c=>[c.id,c]));
 function isPrivateCategory(id){let c=byId.get(id),seen=new Set();while(c&&!seen.has(c.id)){if(c.private)return true;seen.add(c.id);c=byId.get(c.parentId)}return false}
 state.publicCats=allCats.filter(c=>!isPrivateCategory(c.id));state.privateCats=allCats.filter(c=>isPrivateCategory(c.id));
 state.publicBks=allBks.filter(b=>!b.private&&!isPrivateCategory(b.categoryId));state.privateBks=allBks.filter(b=>b.private||isPrivateCategory(b.categoryId));
 savePublic();
 const snapshot={categories:state.privateCats,bookmarks:state.privateBks},key=state.accountKey,record=state.account;
 writeQueue=writeQueue.catch(()=>{}).then(async()=>{const cipher=await encryptData(key,snapshot);const updated={...record,...cipher};localStorage.setItem(ACCOUNT,JSON.stringify(updated));state.account=updated});
 return writeQueue.catch(e=>{toast('私密数据写入失败：'+e.message,true);return false});
}
async function register(email,password){if(!crypto?.subtle)throw Error('请使用支持 Web Crypto 的现代浏览器');if(password.length<8)throw Error('密码至少 8 位');const salt=crypto.getRandomValues(new Uint8Array(16));const key=await derive(password,salt);const initialPrivate={categories:[{id:'demo-private',name:'个人收藏',parentId:null,color:colors[0],private:true},{id:'demo-private-child',name:'私人资料',parentId:'demo-private',color:colors[0],private:false}],bookmarks:[{id:'demo-bookmark',title:'个人知识库（示例）',url:'https://example.com/',desc:'演示私密书签：登录后直接显示在全部书签内',categoryId:'demo-private-child',symbol:'P',color:'#8174d3',favorite:false,clicks:0,tags:['私人'],createdAt:new Date().toISOString().slice(0,10),notes:'此记录仅用于展示，可随时删除',private:false}]};
 const encrypted=await encryptData(key,initialPrivate);const account={version:3,email:email.trim(),salt:b64(salt),...encrypted};localStorage.setItem(ACCOUNT,JSON.stringify(account));state.account=account;state.accountKey=key;state.privateCats=initialPrivate.categories;state.privateBks=initialPrivate.bookmarks;savePublic();
}
async function login(email,password){if(!state.account)throw Error('还未创建本地演示账号');if(email.trim().toLowerCase()!==state.account.email.toLowerCase())throw Error('账号不存在');const key=await derive(password,fromB64(state.account.salt));let result;try{result=await decryptData(key,state.account)}catch{throw Error('密码不正确')}if(!Array.isArray(result.categories)||!Array.isArray(result.bookmarks))throw Error('私密数据格式错误');state.accountKey=key;state.privateCats=result.categories;state.privateBks=result.bookmarks}

async function migrateOldVault(password){const vault=json(OLD_VAULT);if(!vault)throw Error('未找到旧版加密数据');const key=await deriveV2(password,fromB64(vault.salt));let data;try{data=await decryptData(key,vault)}catch{throw Error('旧版私密密码不正确')}const oldIds=new Set(cats().map(c=>c.id));let imported=0;for(const c of data.categories||[]){if(oldIds.has(c.id))continue;state.privateCats.push({...c});oldIds.add(c.id);imported++}const bkIds=new Set(bks().map(b=>b.id));let importedB=0;for(const b of data.bookmarks||[]){if(bkIds.has(b.id))continue;state.privateBks.push({...b});bkIds.add(b.id);importedB++}await saveAll();return {categories:imported,bookmarks:importedB}}
async function deriveV2(password,salt){const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}

document.addEventListener('submit',async e=>{const f=e.target;if(!['engine-form','auth-form','category-form','bookmark-form','bulk-form','migrate-form'].includes(f.id))return;e.preventDefault();try{
if(f.id==='engine-form'){const q=f.querySelector('input').value.trim();if(q){const eng=engines.find(x=>x.id===state.engine)||engines[0];window.open(eng.url(q),'_blank','noopener,noreferrer')}return}
if(f.id==='auth-form'){const password=f.elements.password.value,email=f.elements.email.value,signup=!state.account,btn=f.querySelector('[type=submit]');btn.disabled=true;$('#auth-error').textContent='';try{if(signup){if(password!==f.elements.confirm.value)throw Error('两次密码不一致');await register(email,password)}else await login(email,password);closeModal();render();toast('登录成功，私密内容已直接显示')}catch(err){$('#auth-error').textContent=err.message}finally{if(btn.isConnected)btn.disabled=false}return}
if(f.id==='migrate-form'){const result=await migrateOldVault(f.elements.password.value);closeModal();render();toast(`成功导入 ${result.categories} 个分类、${result.bookmarks} 条书签`);return}
if(f.id==='category-form'){if(!requireLogin())return;const id=f.dataset.id||uid('c'),name=f.elements.name.value.trim(),parentId=f.elements.parentId.value||null,prior=getCat(id),priv=!!f.elements.private.checked&&!catPrivate(parentId);if(!name){$('#category-error').textContent='请填写分类名称';return}if(cats().some(c=>c.id!==id&&c.parentId===parentId&&c.name===name)){$('#category-error').textContent='该层级已存在同名分类';return}const obj={id,name,parentId,color:prior?.color||colors[cats().length%colors.length],private:priv};state.publicCats=state.publicCats.filter(c=>c.id!==id);state.privateCats=state.privateCats.filter(c=>c.id!==id);state.publicCats.push(obj);await saveAll();closeModal();render();toast('分类已保存');return}
if(f.id==='bookmark-form'){if(!requireLogin())return;const title=f.elements.title.value.trim(),url=urlNorm(f.elements.url.value),id=f.dataset.id||uid('b');if(!title||!goodUrl(url)){toast('请输入有效标题和网站地址',true);return}const prior=getBk(id),cid=f.elements.categoryId.value||null,b={id,title,url,categoryId:cid,private:!!f.elements.private.checked&&!catPrivate(cid),desc:f.elements.desc.value.trim(),notes:f.elements.notes.value.trim(),tags:[...new Set(f.elements.tags.value.split(/[,，]/).map(x=>x.trim()).filter(Boolean))].slice(0,16),favorite:f.elements.favorite.checked,color:prior?.color||'#8174dc',symbol:prior?.symbol||title[0].toUpperCase(),clicks:prior?.clicks||0,createdAt:prior?.createdAt||new Date().toISOString().slice(0,10)};state.publicBks=state.publicBks.filter(x=>x.id!==id);state.privateBks=state.privateBks.filter(x=>x.id!==id);state.publicBks.unshift(b);await saveAll();go('edit/'+id);toast(prior?'已保存修改':'书签已添加');return}
if(f.id==='bulk-form'){const picked=chosen(),mode=f.dataset.mode;if(mode==='move'){picked.forEach(b=>b.categoryId=f.elements.category.value||null)}else if(mode==='privacy'){const p=f.elements.privacy.value==='true';picked.forEach(b=>b.private=p)}else if(mode==='tags'){const tags=[...new Set(f.elements.tags.value.split(/[,，]/).map(x=>x.trim()).filter(Boolean))],op=f.elements.operation.value;for(const b of picked){const origin=b.tags||[];b.tags=op==='replace'?tags:op==='remove'?origin.filter(x=>!tags.includes(x)):[...new Set([...origin,...tags])]}}await saveAll();const count=picked.length;state.selected.clear();closeModal();render();toast(`批量操作成功，已更新 ${count} 条书签`);return}
}catch(err){const box=$('#migrate-error');if(f.id==='migrate-form'&&box)box.textContent=err.message;else toast('操作失败：'+err.message,true)}});
window.addEventListener('hashchange',()=>{state.selected.clear();render()});
$('#app').insertAdjacentHTML('afterend','<div id="dialog-host"></div><div id="toast-host" class="toast-host" aria-live="polite"></div>');
savePublic();if(!location.hash)location.hash='#/home';render();
})();

</script>
</body>
</html>
